services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    ports: !reset []

  frontend:
    restart: unless-stopped
    ports: !override
      - "${FRONTEND_PORT:-80}:80"

  prometheus:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"