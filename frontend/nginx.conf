server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o destino numa variavel, o nome "api" e
    # resolvido a cada requisicao, e nao na subida: se a API ainda nao estiver
    # de pe, o nginx sobe mesmo assim e responde 502 ate ela ficar pronta —
    # em vez de se recusar a iniciar e entrar em loop de reinicio.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api http://api:8080;

    # Herdados pelos blocos location abaixo.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Chamadas de API vao para o container da API. O navegador enxerga tudo na
    # mesma origem, entao nao ha preflight de CORS — mas o header Origin ainda
    # chega ao Spring, por isso CORS_ALLOWED_ORIGINS precisa conter a URL por
    # onde o front e acessado.
    location /v1/ {
        proxy_pass $api;
    }

    location /transaction {
        proxy_pass $api;
    }

    location /user {
        proxy_pass $api;
    }

    location /bank/ {
        proxy_pass $api;
    }

    # O index.html nunca pode ser cacheado, senao o navegador fica preso numa
    # versao antiga apos um deploy. Os bundles tem hash no nome e podem.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rotas do Angular (/painel, /transacoes, ...) nao existem em disco:
    # devolvemos o index.html e o roteador do front resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
