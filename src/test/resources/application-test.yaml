spring:
  datasource:
    url: jdbc:h2:mem:finance_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: false

api:
  security:
    token:
      # segredo exclusivo de teste, sem valor fora da suite
      secret: test-secret-test-secret-test-secret-test-secret-test-secret-0123
      expiration: 3600000

    refresh-token:
      expiration: 604800000

  cors:
    allowed-origins: http://localhost:5173
