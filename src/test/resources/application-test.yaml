spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  datasource:
    url: jdbc:h2:mem:finance_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: false

api:
  security:
    token:
      secret: test-secret-test-secret-test-secret-test-secret-test-secret-0123
      expiration: 3600000

    refresh-token:
      expiration: 604800000

    login:
      max-attempts: 5
      lock-minutes: 15

    password-reset:
      expiration-minutes: 30
      cooldown-seconds: 60

    rate-limit:
      enabled: false
      trust-forwarded-for: false

    email-verification:
      expiration-hours: 24
      cooldown-seconds: 60

  cors:
    allowed-origins: http://localhost:4200

app:
  frontend-url: http://localhost:4200

mail:
  transport: log
  async: false
  from: no-reply@finance.test

bank:
  provider: mock
  mock:
    enabled: false
  sync:
    enabled: false
    cron: "0 0 0 1 1 *"
  pluggy:
    client-id: ""
    client-secret: ""
    base-url: http://127.0.0.1:9
    include-credit-cards: false
    webhook-secret: ""
    webhook-base-url: ""

