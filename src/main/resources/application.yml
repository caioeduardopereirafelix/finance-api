spring:
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:2MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:2MB}

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

management:
  health:
    mail:
      enabled: false

  server:
    port: ${MANAGEMENT_PORT:9091}

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

api:
  security:
    token:
      secret: "${JWT_SECRET:}"
      expiration: ${JWT_EXPIRATION:86400000}

    refresh-token:
      expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}

    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}

    password-reset:
      expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
      cooldown-seconds: ${PASSWORD_RESET_COOLDOWN_SECONDS:60}

    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
      register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:10}
      forgot-per-hour: ${RATE_LIMIT_FORGOT_PER_HOUR:10}
      reset-per-hour: ${RATE_LIMIT_RESET_PER_HOUR:20}
      verify-per-hour: ${RATE_LIMIT_VERIFY_PER_HOUR:30}
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:30}

    email-verification:
      expiration-hours: ${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
      cooldown-seconds: ${EMAIL_VERIFICATION_COOLDOWN_SECONDS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

mail:
  transport: ${MAIL_TRANSPORT:log}
  async: ${MAIL_ASYNC:true}
  max-attempts: ${MAIL_MAX_ATTEMPTS:3}
  retry-backoff-seconds: ${MAIL_RETRY_BACKOFF_SECONDS:2}
  from: ${MAIL_FROM:no-reply@finance.local}
  smtp:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    starttls: ${MAIL_STARTTLS:true}

bank:
  provider: ${BANK_PROVIDER:mock}
  mock:
    enabled: ${BANK_MOCK_ENABLED:false}
  sync:
    enabled: ${BANK_SYNC_ENABLED:false}
    cron: ${BANK_SYNC_CRON:0 0 * * * *}
  pluggy:
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    base-url: ${PLUGGY_BASE_URL:https://api.pluggy.ai}
    include-credit-cards: ${PLUGGY_INCLUDE_CREDIT_CARDS:false}
    webhook-secret: ${PLUGGY_WEBHOOK_SECRET:}
    webhook-base-url: ${PLUGGY_WEBHOOK_BASE_URL:}
