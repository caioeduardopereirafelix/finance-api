spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true

management:
  # O actuator sai da porta publica da API e passa a responder numa porta
  # separada, que deve ficar restrita a rede interna (Prometheus, probes).
  server:
    port: ${MANAGEMENT_PORT:9091}

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: when-authorized

api:
  security:
    token:
      # Sem valor padrao de proposito: a aplicacao nao sobe sem JWT_SECRET,
      # em vez de rodar com um segredo conhecido.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}

    refresh-token:
      expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}